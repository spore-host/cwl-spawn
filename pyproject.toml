[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cwl-spawn"
version = "0.2.0"
description = "Run each CWL CommandLineTool step on an ephemeral EC2 instance via spore-host/spawn"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "scttfrdmn" }]
keywords = ["cwl", "cwltool", "bioinformatics", "aws", "ec2", "workflow", "spawn"]
# cwltool is pinned to an exact build: cwl-spawn subclasses cwltool's internal
# job-runner classes (CommandLineJob.run, CommandLineTool.make_job_runner), which
# cwltool versions by date with no semver contract. A drift-guard test fails
# loudly if a bump moves the seam. See CLAUDE.md.
dependencies = [
    "cwltool==3.2.20260720092025",
]

[project.optional-dependencies]
# ruff is capped below 0.16: that release moved a large set of opinionated rules
# (BLE, PLW, TRY, C408, EXE, B017, UP035, …) into the DEFAULT rule set, so an
# unpinned `ruff check .` silently changes what CI enforces whenever ruff
# publishes — the lint here went red with no code change on our side. Same cap as
# airflow-spawn, miniwdl-spawn and snakemake-executor-plugin-spawn. Raising it is
# a deliberate change: pick the rules to adopt via an explicit
# `[tool.ruff.lint] select`, don't inherit them.
# `pyyaml` is a test-only dependency: tests/test_ci_hygiene.py parses
# .github/dependabot.yml. It is imported unguarded there on purpose — a
# try/except import degrades to a skip, and a skipped wiring test reports green
# while asserting nothing.
dev = ["pytest>=7", "ruff>=0.5,<0.16", "mypy>=1.8", "pyyaml>=6"]

[project.scripts]
# cwltool has no plugin entry-point (unlike miniwdl's container_backend), so the
# integration ships as its own CLI that drives cwltool as a library with a custom
# construct_tool_object hook.
cwl-spawn = "cwl_spawn.cli:main"

[project.urls]
Homepage = "https://github.com/spore-host/cwl-spawn"
Issues = "https://github.com/spore-host/spore-host/issues/396"

[tool.setuptools.packages.find]
include = ["cwl_spawn*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
